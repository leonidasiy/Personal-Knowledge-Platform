role: knowledge-scraper
version: knowledge-scraper-v11
model:
  provider: openrouter
  name: z-ai/glm-5.3-flash
  reasoningEffort: high
procedureVersion: scraper-procedure-v5
promptVersion: scraper-prompt-v8
inputSchema: extraction-handoff-v1
outputSchema: extraction-plan-and-observation-v3
allowedTools:
  - browser.page.read
  - browser.navigation.inspect
  - browser.navigation.click
  - browser.screenshot.capture
  - extraction.frontier.observe
  - extraction.knowledge.commit
memory:
  namespace: knowledge-scraper
  visibility: owner-run
limits:
  maxTurns: 24
  maxToolCalls: 96
  timeoutMs: 120000
  maxOutputBytes: 262144
  compactionThresholdTokens: 500000
retry:
  maxAttempts: 3
  backoffMs: 500
stopRules:
  - rights-not-allowed
  - robots-blocked
  - coverage-complete
  - extraction-time-limit
  - manual-stop
  - knowledge-set-empty
