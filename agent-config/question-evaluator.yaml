# Legacy role ID retained for persisted runs; this is the production reviewer.
# External test evaluation has separate calls and no publication authority.
role: question-evaluator
version: question-evaluator-v7
model:
  provider: openrouter
  name: xiaomi/mimo-v2.6-pro
  reasoningEffort: none
procedureVersion: evaluator-procedure-v1
promptVersion: evaluator-prompt-v3
inputSchema: quiz-evaluation-handoff-v1
outputSchema: quiz-evaluation-v1
allowedTools:
  - quiz.evidence.lookup
  - quiz.question.validate
memory:
  namespace: question-evaluator
  visibility: owner-run
limits:
  maxTurns: 3
  maxToolCalls: 6
  timeoutMs: 120000
  maxOutputBytes: 131072
  compactionThresholdTokens: 500000
retry:
  maxAttempts: 2
  backoffMs: 500
stopRules:
  - score-passing
  - score-failing
  - evaluator-limit-reached
  - rights-revoked
